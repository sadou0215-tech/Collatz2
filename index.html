<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>コラッツ予想 自動計算</title>
<style>
:root{--bg:#f4f6f3;--card:#fff;--fg:#1d2b25;--sub:#5d6b64;--line:#d5ddd8;--acc:#1f7a5a;--acc2:#c2410c}
@media (prefers-color-scheme:dark){:root{--bg:#121815;--card:#1a221e;--fg:#e6eee9;--sub:#93a39a;--line:#2c3832;--acc:#4cc394;--acc2:#fb923c}}
*{box-sizing:border-box}
body{margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);font-family:"Hiragino Sans","Yu Gothic",Meiryo,sans-serif;line-height:1.7}
.wrap{max-width:680px;margin:0 auto;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:24px}
h1{font-size:1.4rem;margin:0 0 4px}
.modebtn{padding:0;background:none;color:var(--fg);font:inherit;font-weight:bold;text-align:left;border:0;border-bottom:2px dotted var(--acc);border-radius:0;cursor:pointer}
.modebtn small{font-weight:normal;font-size:.75rem;color:var(--acc);margin-left:6px}
p.lead{margin:0 0 16px;color:var(--sub)}
.row{display:flex;gap:8px;flex-wrap:wrap}
input{flex:1 1 180px;min-width:0;padding:10px;font-size:1rem;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
button{padding:10px 18px;font-size:1rem;border:0;border-radius:6px;background:var(--acc);color:#fff;cursor:pointer}
button:focus-visible,input:focus-visible{outline:3px solid var(--acc2);outline-offset:2px}
.hidden{display:none}
.err{color:var(--acc2);min-height:1.5em;margin:6px 0 0;font-size:.9rem}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin:18px 0}
.stat{border:1px solid var(--line);border-radius:6px;padding:10px 12px}
.stat b{display:block;font-size:1.25rem;overflow-wrap:anywhere}
.stat span{font-size:.8rem;color:var(--sub)}
svg{width:100%;height:auto;display:block;border:1px solid var(--line);border-radius:6px}
.tablebox{max-height:320px;overflow:auto;margin-top:12px;border:1px solid var(--line);border-radius:6px}
table{width:100%;border-collapse:collapse;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.9rem}
th,td{padding:6px 10px;text-align:left;border-bottom:1px solid var(--line);overflow-wrap:anywhere}
th{position:sticky;top:0;background:var(--card)}
.note{font-size:.85rem;color:var(--sub);margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <h1><button type="button" class="modebtn" id="modeBtn" aria-live="polite"><span id="title">コラッツ予想 自動計算</span><small>⇄ タップで切り替え</small></button></h1>
  <p class="lead" id="lead"></p>
  <div class="row">
    <input type="text" id="start" inputmode="numeric" value="27" aria-label="開始する整数">
    <input type="text" id="end" inputmode="numeric" class="hidden" aria-label="終了する整数" placeholder="終了">
    <button id="calc">計算スタート</button>
  </div>
  <p class="err" id="calcErr" role="alert"></p>

  <div id="result" class="hidden">
    <div class="stats" id="stats"></div>
    <div id="chartBox">
      <svg id="chart" viewBox="0 0 600 240" role="img" aria-label="値の推移グラフ"></svg>
      <p class="note">縦軸は対数目盛です。</p>
    </div>
    <div id="tableBox">
      <div class="tablebox"><table>
        <thead><tr id="head"></tr></thead>
        <tbody id="rows"></tbody>
      </table></div>
      <p class="note" id="truncNote"></p>
    </div>
  </div>
</div>

<script>
const MAX_STEPS = 100000;   // コラッツ用の上限
const MAX_DIV = 1000000;    // 素数判定で試す割る数の上限
const MAX_ROWS = 5000;
const $ = id => document.getElementById(id);

const MODES = {
  collatz: {
    title: 'コラッツ予想 自動計算',
    lead: '正の整数を入力すると、1になるまで計算します。偶数なら÷2、奇数なら×3+1。',
    def: '27'
  },
  prime: {
    title: '素数計算機',
    lead: '整数を入力すると、素数か、素数のかけ算にするとどうなるかを表示します。例：91 = 7 × 13',
    def: '91'
  },
  list: {
    title: '素数一覧',
    lead: '開始と終了の数を入力すると、その間にある素数を一覧にします。最大は 1000垓（10^23）までです。',
    def: '1',
    def2: '100'
  }
};
const ORDER = ['collatz', 'prime', 'list'];
const LIMIT = 10n ** 23n;      // 1000垓
const MAX_LIST = 1000;         // 一覧に出す素数の最大数
const MAX_SCAN = 100000;       // 一度に調べる奇数の最大数
const MR_LIMIT = 3317044064679887385961981n; // この未満ならミラー–ラビン法で確定判定
let mode = 'collatz';

/* ---------- コラッツ ---------- */
function collatz(n){
  const seq = [n], ops = ['開始'];
  let peak = n, odd = 0, even = 0;
  while (n > 1n && seq.length <= MAX_STEPS){
    if (n % 2n === 0n){ n /= 2n; even++; ops.push('÷2'); }
    else { n = n * 3n + 1n; odd++; ops.push('×3+1'); }
    seq.push(n);
    if (n > peak) peak = n;
  }
  return { seq, ops, peak, odd, even, done: n === 1n };
}

function log10Big(x){
  const s = x.toString();
  return s.length <= 15 ? Math.log10(Number(x))
       : (s.length - 16) + Math.log10(Number(s.slice(0,16)));
}

function drawChart(seq){
  const W=600,H=240,L=8,R=8,T=12,B=12;
  const ys = seq.map(log10Big);
  let max = 0.1; for (const y of ys) if (y > max) max = y;
  const stepX = (W-L-R) / Math.max(seq.length-1, 1);
  const pts = ys.map((y,i) => (L+i*stepX).toFixed(1)+','+(H-B-(y/max)*(H-T-B)).toFixed(1)).join(' ');
  $('chart').innerHTML = '<polyline points="'+pts+'" fill="none" stroke="var(--acc)" stroke-width="1.6" stroke-linejoin="round"/>';
}

/* ---------- 素数 ---------- */
function factorize(n){
  const factors = [];
  let m = n, d = 2n, count = 0;
  while (d * d <= m && count < MAX_DIV){
    if (m % d === 0n){ factors.push(d); m /= d; }
    else { d += (d === 2n) ? 1n : 2n; }
    count++;
  }
  let limited = d * d <= m;     // 上限で止まり、残りが未判定
  if (limited && m < MR_LIMIT && isPrime(m)){ factors.push(m); limited = false; }
  else if (!limited && m > 1n) factors.push(m);
  return { factors, limited };
}
function formatFactors(fs){
  const groups = [];
  for (const f of fs){
    const g = groups[groups.length - 1];
    if (g && g[0] === f) g[1]++; else groups.push([f, 1]);
  }
  return groups.map(([f, k]) => k > 1 ? f + '^' + k : f.toString()).join(' × ');
}

/* ---------- 素数判定（ミラー–ラビン法） ---------- */
const SMALL = [2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n,41n,43n,47n,53n,59n,61n,67n,71n,73n,79n,83n,89n,97n];
const MR_BASES = [2n,3n,5n,7n,11n,13n,17n,19n,23n,29n,31n,37n,41n];
function modpow(b, e, m){
  let r = 1n; b %= m;
  while (e > 0n){ if (e & 1n) r = r * b % m; b = b * b % m; e >>= 1n; }
  return r;
}
// n < MR_LIMIT の範囲で確定判定
function isPrime(n){
  if (n < 2n) return false;
  for (const p of SMALL){ if (n === p) return true; if (n % p === 0n) return false; }
  let d = n - 1n, s = 0;
  while ((d & 1n) === 0n){ d >>= 1n; s++; }
  for (const a of MR_BASES){
    let x = modpow(a, d, n);
    if (x === 1n || x === n - 1n) continue;
    let ok = false;
    for (let i = 1; i < s; i++){ x = x * x % n; if (x === n - 1n){ ok = true; break; } }
    if (!ok) return false;
  }
  return true;
}

/* ---------- 素数一覧 ---------- */
function listPrimes(a, b){
  const out = [];
  let n = a, scanned = 0;
  if (n <= 2n && b >= 2n) out.push(2n);
  if (n < 3n) n = 3n;
  if (n % 2n === 0n) n += 1n;
  while (n <= b && scanned < MAX_SCAN && out.length < MAX_LIST){
    if (isPrime(n)) out.push(n);
    n += 2n; scanned++;
  }
  const reason = n > b ? 'end' : (out.length >= MAX_LIST ? 'list' : 'scan');
  return { out, next: n, reason };
}
function norm(v){
  return v.trim()
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[,，\s]/g, '');
}
function runList(){
  const ra = norm($('start').value), rb = norm($('end').value);
  if (!/^[0-9]+$/.test(ra) || !/^[0-9]+$/.test(rb) || BigInt(ra) < 1n || BigInt(rb) < 1n){
    $('calcErr').textContent = '開始と終了に、1以上の正の整数を入力してください。';
    return;
  }
  const a = BigInt(ra), b = BigInt(rb);
  if (b > LIMIT){ $('calcErr').textContent = '終了は 1000垓（100000000000000000000000）以下にしてください。'; return; }
  if (a > b){ $('calcErr').textContent = '開始は終了以下の数にしてください。'; return; }

  const r = listPrimes(a, b);
  $('chartBox').classList.add('hidden');
  $('tableBox').classList.remove('hidden');
  showStats([
    ['範囲', a + ' 〜 ' + b],
    ['見つかった素数', r.out.length + '個' + (r.reason === 'end' ? '' : '（途中まで）')]
  ]);
  showTable(['#', '素数'], r.out.map((p, i) => [i + 1, p.toString()]));
  $('truncNote').textContent =
    r.reason === 'list' ? '表示上限の ' + MAX_LIST + ' 個に達したため、ここで止めました。続きは開始を ' + r.next + ' にして調べてください。' :
    r.reason === 'scan' ? '調べる数が多いため ' + (r.next - 1n) + ' までで止めました。続きは開始を ' + r.next + ' にして調べてください。' :
    (r.out.length === 0 ? 'この範囲に素数はありません。' : '');
  $('result').classList.remove('hidden');
}

/* ---------- 表示共通 ---------- */
function showStats(items){
  $('stats').replaceChildren(...items.map(([label, val]) => {
    const d = document.createElement('div'); d.className = 'stat';
    const b = document.createElement('b'); b.textContent = val;
    const s = document.createElement('span'); s.textContent = label;
    d.append(b, s); return d;
  }));
}
function showTable(headers, rows){
  $('head').replaceChildren(...headers.map(h => {
    const th = document.createElement('th'); th.textContent = h; return th;
  }));
  const frag = document.createDocumentFragment();
  rows.forEach(cells => {
    const tr = document.createElement('tr');
    cells.forEach(t => { const td = document.createElement('td'); td.textContent = t; tr.appendChild(td); });
    frag.appendChild(tr);
  });
  $('rows').replaceChildren(frag);
}

function run(){
  $('calcErr').textContent = '';
  if (mode === 'list'){ runList(); return; }
  const raw = $('start').value.trim()
    .replace(/[０-９]/g, c => String.fromCharCode(c.charCodeAt(0) - 0xFEE0))
    .replace(/[,，\s]/g,'');
  if (!/^[0-9]+$/.test(raw) || BigInt(raw) < 1n){
    $('calcErr').textContent = '1以上の正の整数を入力してください。';
    return;
  }
  const n = BigInt(raw);

  if (mode === 'collatz'){
    const r = collatz(n);
    const steps = r.seq.length - 1;
    showStats([
      ['入力した値', raw],
      ['1になるまでの回数', steps + '回' + (r.done ? '' : '（上限で停止）')],
      ['最大値', r.peak.toString()],
      ['÷2 の回数 / ×3+1 の回数', r.even + ' / ' + r.odd]
    ]);
    $('chartBox').classList.remove('hidden');
    $('tableBox').classList.remove('hidden');
    drawChart(r.seq);
    showTable(['#','値','操作'], r.seq.slice(0, MAX_ROWS).map((v,i) => [i, v.toString(), r.ops[i]]));
    $('truncNote').textContent = r.seq.length > MAX_ROWS ? '表は最初の ' + MAX_ROWS + ' 行のみ表示しています。' : '';
  } else {
    $('chartBox').classList.add('hidden');
    $('tableBox').classList.add('hidden');
    let result;
    if (n === 1n){
      result = '1 は素数でも合成数でもありません';
    } else {
      const f = factorize(n);
      if (f.limited) result = '判定できませんでした（上限で停止）';
      else if (f.factors.length === 1) result = raw + ' は素数です';
      else result = raw + ' = ' + formatFactors(f.factors);
    }
    showStats([['入力した値', raw], ['結果', result]]);
  }
  $('result').classList.remove('hidden');
}

function setMode(m){
  mode = m;
  const c = MODES[m];
  $('title').textContent = c.title;
  document.title = c.title;
  $('lead').textContent = c.lead;
  $('start').value = c.def;
  $('end').classList.toggle('hidden', m !== 'list');
  if (m === 'list') $('end').value = c.def2;
  $('start').placeholder = m === 'list' ? '開始' : '';
  $('calcErr').textContent = '';
  $('result').classList.add('hidden');
}

$('modeBtn').onclick = () => setMode(ORDER[(ORDER.indexOf(mode) + 1) % ORDER.length]);
$('calc').onclick = run;
['start', 'end'].forEach(id => $(id).addEventListener('keydown', e => { if (e.key === 'Enter') run(); }));
setMode('collatz');
</script>
</body>
</html>
